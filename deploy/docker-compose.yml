# Example stack: fixed Docker network so HV_TRUSTED_PROXIES matches the nginx container.
# Copy deploy/.env.production.example to deploy/.env (git-ignored pattern: keep secrets off git)
# and fill values before `docker compose -f deploy/docker-compose.yml up -d`.
#
# This file is a staging template only — replace certificate paths, domain and secrets.

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8443:443"
    volumes:
      - ./nginx/hv-swim.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      hv:
        ipv4_address: 172.28.0.2
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      HV_LOAD_DOTENV: "false"
      HV_DATA_DIR: /data
      HV_TRUSTED_PROXIES: 172.28.0.2
      HV_FORWARDED_ALLOW_IPS: 172.28.0.2
    volumes:
      - hv-data:/data
    networks:
      hv:
        ipv4_address: 172.28.0.3
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  hv:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  hv-data:
