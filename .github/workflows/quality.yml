name: Quality

on:
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:
  push:
    branches: [main, 'codex/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - name: Audit Python dependencies without advisory exceptions
        run: python -m pip_audit -r requirements-dev.txt

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit
      - name: Check JavaScript syntax
        run: for file in assets/*.js scripts/*.mjs; do node --check "$file"; done
      - run: node scripts/check-site.mjs
      - run: node tests/test_logout.mjs
      - run: node tests/test_login.mjs
      - run: node tests/test_experience.mjs
      - run: node tests/test_aquatic_scene.mjs
      - run: node tests/test_platform_dates.mjs
      - run: node tests/test_lesson_pathway.mjs

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hv_test
          POSTGRES_USER: hv_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hv_test -d hv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HV_LOAD_DOTENV: 'false'
      HV_TEST_POSTGRES_URL: postgresql://hv_test:disposable-ci-password@127.0.0.1:5432/hv_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_api.py tests/test_launch_operations.py tests/test_workforce.py tests/test_payroll_adapter.py tests/test_postgres_migration.py tests/test_security_hardening.py -q
