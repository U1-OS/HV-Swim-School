name: Quality

on:
  push:
    branches: [main, 'codex/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - name: Audit Python dependencies without advisory exceptions
        run: python -m pip_audit -r requirements-dev.txt

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit
      - name: Check JavaScript syntax
        run: for file in assets/*.js scripts/*.mjs; do node --check "$file"; done
      - run: node scripts/check-site.mjs
      - run: node tests/test_logout.mjs
      - run: node tests/test_login.mjs
      - run: node tests/test_experience.mjs
      - run: node tests/test_aquatic_scene.mjs
      - run: node tests/test_platform_dates.mjs
      - run: node tests/test_lesson_pathway.mjs
